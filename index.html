<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOXA — Change Something</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f3ed;color:#101418;overflow:hidden}button,input{font:inherit}.app{height:100%;position:relative;overflow:hidden}.noise{position:absolute;inset:0;opacity:.03;pointer-events:none}
header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:relative;z-index:5}.logo{font-size:28px;font-weight:900;letter-spacing:-2px}.logo span{display:inline-block;width:9px;height:9px;background:#ff4d2e;border-radius:50%;margin-left:5px}.tag{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#777}.avatar{width:42px;height:42px;border-radius:50%;background:#101418;color:white;display:grid;place-items:center;font-weight:800}
.hero{position:absolute;left:7vw;top:15vh;z-index:4;max-width:590px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:#ff4d2e;margin-bottom:17px}.hero h1{font-size:clamp(55px,7.2vw,112px);line-height:.86;letter-spacing:-7px;margin:0;font-weight:900}.hero h1 em{font-style:normal;color:#ff4d2e}.hero p{font-size:18px;line-height:1.5;max-width:430px;color:#596067;margin:25px 0}
.prompt{width:min(510px,90vw);height:66px;background:#fff;border:1px solid #dedbd4;border-radius:19px;display:flex;align-items:center;padding:7px 8px 7px 21px;box-shadow:0 15px 45px #10141812}.prompt input{border:0;outline:0;background:none;flex:1;font-size:15px;color:#222}.go{border:0;background:#101418;color:white;border-radius:14px;height:52px;padding:0 21px;font-weight:800;cursor:pointer}.go:hover{background:#ff4d2e}
.globe{position:absolute;width:min(720px,72vw);height:min(720px,72vw);right:-7vw;top:8vh;border-radius:50%;background:radial-gradient(circle at 32% 27%,#fff 0,#dce9e6 18%,#91bdb7 40%,#437e78 68%,#183f3d 100%);box-shadow:-40px 40px 100px #183f3d35,inset -35px -30px 90px #071e1d88;overflow:hidden;transform:rotate(-8deg)}.globe:before{content:"";position:absolute;inset:-10%;background:repeating-linear-gradient(15deg,transparent 0 44px,#ffffff30 45px 46px),repeating-linear-gradient(105deg,transparent 0 58px,#ffffff28 59px 60px);border-radius:50%}.globe:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,#fff8 0 2%,transparent 18%),linear-gradient(110deg,transparent 58%,#071e1d45);border-radius:50%}
.pin{position:absolute;z-index:2;width:15px;height:15px;border-radius:50%;background:#ff4d2e;box-shadow:0 0 0 8px #ff4d2e28,0 0 28px #ff4d2e;cursor:pointer}.pin:after{content:"";position:absolute;width:55px;height:55px;border:1px solid #ff4d2e55;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);animation:pulse 2.2s infinite}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.4);opacity:.2}}
.pin.nairobi{left:57%;top:58%}.pin.lagos{left:40%;top:53%}.pin.london{left:46%;top:31%}.pin.tokyo{left:82%;top:42%}.pin.sao{left:30%;top:71%}
.bottom{position:absolute;left:34px;right:34px;bottom:25px;display:flex;align-items:end;justify-content:space-between;z-index:6}.modes{display:flex;gap:8px}.mode{border:1px solid #d8d5cf;background:#ffffffd9;backdrop-filter:blur(12px);padding:13px 18px;border-radius:100px;cursor:pointer;font-size:13px;font-weight:800}.mode:hover,.mode.active{background:#101418;color:#fff;border-color:#101418}.status{background:#fff;border:1px solid #dedbd4;border-radius:17px;padding:12px 16px;display:flex;align-items:center;gap:11px;font-size:12px}.live{width:8px;height:8px;border-radius:50%;background:#28a745;box-shadow:0 0 0 5px #28a7451c}
.panel{position:absolute;right:32px;top:96px;width:310px;background:#fff;border-radius:24px;padding:22px;z-index:10;box-shadow:0 25px 80px #10141822;transform:translateX(130%);transition:.45s}.panel.open{transform:none}.close{float:right;border:0;background:#f1f0ec;width:31px;height:31px;border-radius:50%;cursor:pointer}.panel h3{margin:4px 0 4px;font-size:25px;letter-spacing:-1px}.panel .small{font-size:12px;color:#777}.item{margin-top:17px;padding:15px;border:1px solid #e5e2dc;border-radius:16px;cursor:pointer}.item b{font-size:14px}.item p{font-size:12px;color:#686d71;margin:6px 0}.action{border:0;width:100%;background:#ff4d2e;color:#fff;padding:13px;border-radius:12px;font-weight:800;cursor:pointer;margin-top:8px}.toast{position:absolute;left:50%;bottom:30px;transform:translate(-50%,150px);background:#101418;color:#fff;padding:15px 20px;border-radius:14px;z-index:30;font-size:13px;transition:.4s}.toast.show{transform:translate(-50%,0)}
@media(max-width:850px){body{overflow:auto}.hero{left:24px;top:13vh}.hero h1{letter-spacing:-4px}.hero p{font-size:15px}.globe{width:520px;height:520px;right:-220px;top:27vh;opacity:.8}.bottom{left:20px;right:20px;bottom:18px;align-items:center}.modes{flex-wrap:wrap}.status{display:none}.panel{right:18px;left:18px;top:90px;width:auto}.tag{display:none}}
</style></head>
<body><div class="app"><div class="noise"></div>
<header><div class="logo">DOXA<span></span></div><div class="tag">The action network</div><div class="avatar">T</div></header>
<section class="hero"><div class="eyebrow">A new kind of internet</div><h1>Change<br><em>something.</em></h1><p>Find a problem. Give something a second life. Improve your city. Connect with people who can make things happen.</p>
<div class="prompt"><input id="q" placeholder="What do you want to change?"><button class="go" onclick="act()">DO IT →</button></div></section>
<div class="globe"><div class="pin nairobi" data-city="Nairobi"></div><div class="pin lagos" data-city="Lagos"></div><div class="pin london" data-city="London"></div><div class="pin tokyo" data-city="Tokyo"></div><div class="pin sao" data-city="São Paulo"></div></div>
<div class="bottom"><div class="modes"><button class="mode active" onclick="openMode('solve',this)">🌎 SOLVE</button><button class="mode" onclick="openMode('swap',this)">↔ SWAP</button><button class="mode" onclick="openMode('city',this)">⌂ MYCITY</button></div><div class="status"><span class="live"></span><b>12,842</b> actions happening now</div></div>
<aside class="panel" id="panel"><button class="close" onclick="closePanel()">×</button><div id="content"></div></aside><div class="toast" id="toast"></div>
</div>
<script>
const data={solve:{title:"Problems worth solving",sub:"People are already moving.",items:[["💧","School water shortage","Nairobi · 18 people helping","Connect"],["🪑","40 students need desks","Kisumu · 7 offers","Help solve"],["🌱","Community garden needs tools","Mombasa · 4 hours ago","Contribute"]]},swap:{title:"Give it another life",sub:"Things waiting for a new owner.",items:[["📷","Camera → Laptop","Nairobi · estimated equal value","Match"],["💻","3 laptops available","Nakuru · for a school","Offer"],["🚲","Bicycle → anything useful","Mombasa · open to swaps","Propose"]]},city:{title:"Nairobi right now",sub:"Your city is alive.",items:[["🚧","Road issue reported","Komarock · 12 confirmations","Follow"],["💡","Streetlight fixed","Kayole · resolved today","View"],["🔄","Community swap event","Eastlands · Saturday","Join"]]}};
function openMode(key,btn){document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));btn.classList.add('active');let d=data[key];document.getElementById('content').innerHTML='<h3>'+d.title+'</h3><div class="small">'+d.sub+'</div>'+d.items.map(x=>'<div class="item" onclick="toast(\''+x[2]+'\')"><b>'+x[0]+' '+x[1]+'</b><p>'+x[2]+'</p><button class="action">'+x[3]+' →</button></div>').join('');document.getElementById('panel').classList.add('open')}
function closePanel(){document.getElementById('panel').classList.remove('open')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function act(){const q=document.getElementById('q').value.trim();if(!q){toast('Tell DOXA what you want to change.');return}toast('DOXA is finding a path to action for: '+q);setTimeout(()=>openMode('solve',document.querySelector('.mode')),600)}
document.querySelectorAll('.pin').forEach(p=>p.onclick=()=>{toast('Opening '+p.dataset.city+'…');openMode('city',document.querySelectorAll('.mode')[2])});
</script></body></html>
